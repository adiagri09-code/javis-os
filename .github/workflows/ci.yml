name: Checked composed arm portable check
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  composed-arm-portable:
    runs-on: ubuntu-latest
    env:
      JAVIS_NO_REAL_JUDGE_ENGINE: "1"
      JAVIS_NO_REAL_REVIEW_ENGINE: "1"
      JAVIS_NO_REAL_TEAM_ENGINE: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify exact selected bytes
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          pins=json.loads(Path('.github/composed-arm-portable-pins.json').read_text())
          for name,expected in pins.items():
              actual=hashlib.sha256(Path(name).read_bytes()).hexdigest()
              assert actual==expected,(name,expected,actual)
          print('Exact selected source/test pins verified:',len(pins))
          PY
      - name: Install repository dependencies
        run: python -m pip install -r requirements.txt pytest
      - name: Serial isolated composed arm and affected consumer fixtures
        run: |
          python - <<'PY'
          import os,runpy,sys,time
          from pathlib import Path
          helpers=runpy.run_path('tests/run.py',run_name='compose_schema_portable_helpers')
          for name in ('test_improvement_composed_arms.py', 'test_improvement_composed_api.py', 'test_improvement_composed_protocol.py', 'test_improvement_composed_bounds.py', 'test_improvement_comparison_plans.py', 'test_improvement_experiment_protocol.py', 'test_improvement_comparison_results.py', 'test_improvement_experiment_lineage.py', 'test_improvement_experiment_selection.py', 'test_improvement_experiment_bounds.py', 'test_improvement_experiment_api.py', 'test_improvement_views.py', 'test_improvement_view_admission.py', 'test_improvement_view_lineage.py', 'test_improvement_view_qualification.py', 'test_improvement_operation_worker.py', 'test_improvement_view_trial_protocol.py'):
              started=time.monotonic()
              result=helpers['chay_mot']([sys.executable,'-B',str(Path('tests/python')/name),'-v'],os.environ.copy())
              print(result.stdout+result.stderr,flush=True)
              print(name,'exit',result.returncode,'seconds',round(time.monotonic()-started,3),flush=True)
              if result.returncode: raise SystemExit(result.returncode)
          PY
