name: D2 task skill portable check
on:
  workflow_dispatch:
jobs:
  task-skill-portable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install repository dependencies and test runner
        run: python -m pip install -r requirements.txt pytest
      - name: Serial task-scope and ordinary consumer regression
        run: python tests/run.py --py skill_asset_reads skill_resolution_state skill_da_ngon_ngu skill_usage skill_caps prompt_scan_once adaptive_context_phase8 improvement_task_skill -v
