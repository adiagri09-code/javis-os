name: Qualification portable check
on:
  workflow_dispatch:
jobs:
  qualification-portable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install repository dependencies
        run: python -m pip install -r requirements.txt
      - name: Serial portable qualification preparation checks
        run: |
          python tests/python/test_improvement_qualification_environment.py -v
          python tests/python/test_improvement_qualification_session.py -v
          python tests/python/test_improvement_qualification_records.py -v
          python tests/python/test_improvement_qualification_protocol.py -v
          python tests/python/test_improvement_native_protocol.py -v
